# Vérifications lancées automatiquement à chaque `git commit`
repos:
  # Contrôles génériques sur tous les fichiers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace        # espaces en fin de ligne
      - id: end-of-file-fixer          # une ligne vide en fin de fichier
      - id: check-yaml                 # YAML valide (dbt, CI...)
      - id: check-toml                 # pyproject.toml valide
      - id: check-added-large-files    # bloque les gros fichiers (données, base DuckDB)
        args: ["--maxkb=1000"]
      - id: detect-private-key         # bloque les clés privées

  # Outils du projet, lancés avec les versions verrouillées dans uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pas-de-dotenv
        name: interdit de commiter .env
        entry: "Le fichier .env contient des secrets : il ne doit jamais être commité."
        language: fail
        files: '(^|/)\.env$'
