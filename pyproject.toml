[project]
name = "telco-customer-360"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "azure-storage-blob>=12.31.0",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "google-play-scraper>=1.2.7",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "prefect>=3.8.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "run>=0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "streamlit>=1.65.0",
    "tenacity>=9.1.4",
    "uv>=0.12.22",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
