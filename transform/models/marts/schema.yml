version: 2

models:
  - name: mart_motifs_operateur
    description: >
      Répartition des motifs par opérateur. C'est le pont avec la couche churn :
      les 4 motifs (reseau, facturation, resiliation, service_client) + autre.
    data_tests:
      # une seule ligne par couple (opérateur, motif)
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [operateur, motif]
    columns:
      - name: operateur
        data_tests: [not_null]
      - name: motif
        data_tests: [not_null]
      - name: n_avis
        data_tests: [not_null]
      - name: pct_des_negatifs
        description: Part de ce motif dans les avis négatifs de l'opérateur (%)
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: note_moyenne
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
