version: 2

models:
  - name: stg_avis
    description: Avis nettoyés + motif et sentiment (1 ligne par avis enrichi)
    columns:
      - name: avis_key
        tests: [unique, not_null]
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: [google_play, app_store]
      - name: operateur
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [orange, sfr, bouygues, free]
      - name: note
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: motif
        tests:
          - accepted_values:
              arguments:
                values: [reseau, facturation, resiliation, service_client, autre]
      - name: sentiment
        tests:
          - accepted_values:
              arguments:
                values: [positif, neutre, negatif]

  - name: stg_churn
    description: Clients Kaggle nettoyés (types, noms en français, churn en 0/1)
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: internet
        tests:
          - accepted_values:
              arguments:
                values: [dsl, fibre, aucun]
      - name: contrat
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mensuel, 1_an, 2_ans]
      - name: paiement
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cheque_electronique, cheque_postal, virement_auto, carte_auto]
      - name: montant_mensuel
        tests: [not_null]
      - name: churn
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
