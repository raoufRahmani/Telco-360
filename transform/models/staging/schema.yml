version: 2

models:
  - name: stg_raw_avis
    description: Avis bruts nettoyés (texte, date), 1 ligne par avis collecté
    columns:
      - name: avis_key
        description: Clé unique "source:id"
        data_tests: [unique, not_null]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [google_play, app_store]
      - name: operateur
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [orange, sfr, bouygues, free]
      - name: note
        description: Note de 1 à 5 étoiles
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5

  - name: stg_enriched_avis
    description: Motif et sentiment attribués par le LLM, 1 ligne par avis enrichi
    columns:
      - name: avis_key
        data_tests:
          - unique
          - not_null
          # chaque avis enrichi doit exister dans les avis bruts
          - relationships:
              arguments:
                to: ref('stg_raw_avis')
                field: avis_key
      - name: motif
        data_tests:
          - accepted_values:
              arguments:
                values: [reseau, facturation, resiliation, service_client, autre]
      - name: sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: [positif, neutre, negatif]

  - name: stg_churn
    description: Clients Kaggle nettoyés (types, noms en français, churn en 0/1)
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: internet
        data_tests:
          - accepted_values:
              arguments:
                values: [dsl, fibre, aucun]
      - name: contrat
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mensuel, 1_an, 2_ans]
      - name: paiement
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cheque_electronique, cheque_postal, virement_auto, carte_auto]
      - name: montant_mensuel
        data_tests: [not_null]
      - name: churn
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
